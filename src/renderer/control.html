<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: dsc-model:; connect-src 'self' data: blob: dsc-model:; media-src blob:">
<title>DeepSeek-chan</title>
<link rel="stylesheet" href="control.css">
</head>
<body>
<nav>
  <button data-tab="dashboard" data-i18n="ui.navDashboard"></button>
  <button data-tab="log" data-i18n="ui.navLog"></button>
  <button data-tab="connection" data-i18n="ui.navConnection"></button>
  <button data-tab="voice" data-i18n="ui.navVoice"></button>
  <button data-tab="character" data-i18n="ui.navGeneral"></button>
  <button data-tab="update" id="nav-update"></button>
</nav>
<main>

<section id="dashboard" hidden>
  <header class="row between">
    <h1 data-i18n="ui.usage"></h1>
    <div class="row">
      <div class="segmented" id="range">
        <button data-days="7" data-i18n="ui.days7"></button>
        <button data-days="30" data-i18n="ui.days30"></button>
        <button data-days="90" data-i18n="ui.days90"></button>
      </div>
      <div class="segmented" id="currency">
        <button data-cur="USD">USD</button>
        <button data-cur="KRW">KRW</button>
      </div>
    </div>
  </header>
  <div class="dash-top">
    <div id="mascot" class="mascot" hidden><img alt="" draggable="false"></div>
    <div class="tiles" id="tiles"></div>
  </div>
  <div class="card">
    <h2 data-i18n="ui.dailyCost"></h2>
    <div id="legend" class="legend"></div>
    <div id="chart" class="chart"><div id="tooltip" hidden></div></div>
  </div>
  <div class="card">
    <h2 data-i18n="ui.byApi"></h2>
    <table id="by-api"></table>
  </div>
  <div class="card">
    <h2 data-i18n="ui.recent"></h2>
    <table id="recent"></table>
  </div>
  <p class="note" data-i18n="ui.costNote"></p>
  <button id="clear-usage" class="ghost danger" data-i18n="ui.clearUsage"></button>
</section>

<section id="log" hidden>
  <header class="log-head">
    <h1 data-i18n="ui.logTitle"></h1>
    <input id="log-search" type="search" data-i18n-placeholder="ui.logSearch" data-i18n-aria="ui.logSearch">
    <span id="log-count" class="note"></span>
    <button id="log-new" class="ghost" data-i18n="ui.logNew"></button>
    <button id="log-clear" class="ghost danger" data-i18n="ui.logClear"></button>
  </header>
  <div class="log-layout">
    <ul id="log-sessions" data-i18n-aria="ui.logSessions"></ul>
    <div class="log-main">
      <div class="log-session-bar">
        <b id="log-title"></b>
        <span id="log-session-meta" class="note"></span>
        <button id="log-resume" class="ghost" data-i18n="ui.logResume"></button>
        <button id="log-delete" class="ghost danger" data-i18n="ui.logDelete"></button>
      </div>
      <div id="log-list"></div>
    </div>
  </div>
</section>

<section id="connection" hidden>
  <h1 data-i18n="ui.connTitle"></h1>
  <p class="note" data-i18n="ui.connNote"></p>
  <div class="split">
    <div>
      <ul id="profiles" class="list"></ul>
      <button id="add-profile" class="ghost" data-i18n="ui.addProfile"></button>
    </div>
    <form id="profile-form" class="card form">
      <label><span data-i18n="ui.preset"></span>
        <select id="p-preset"></select>
      </label>
      <label><span data-i18n="ui.name"></span> <input id="p-name" required></label>
      <label>Base URL <input id="p-url" required placeholder="https://api.example.com/v1"></label>
      <label><span data-i18n="ui.apiKey"></span> <input id="p-key" type="password" autocomplete="off"></label>
      <label><span data-i18n="ui.model"></span>
        <span class="row"><input id="p-model" list="p-models" required><datalist id="p-models"></datalist>
        <button type="button" id="p-fetch" class="ghost" data-i18n="ui.fetchModels"></button></span>
      </label>
      <label><span data-i18n="ui.extra"></span>
        <textarea id="p-extra" rows="2" spellcheck="false" placeholder='{"temperature": 0.7}'></textarea>
      </label>
      <fieldset>
        <legend data-i18n="ui.pricing"></legend>
        <div class="row">
          <label><span data-i18n="ui.priceInput"></span> <input id="p-input" type="number" step="any" min="0"></label>
          <label><span data-i18n="ui.priceCached"></span> <input id="p-cached" type="number" step="any" min="0"></label>
          <label><span data-i18n="ui.priceOutput"></span> <input id="p-output" type="number" step="any" min="0"></label>
        </div>
        <label class="check"><input id="p-peak" type="checkbox"> <span data-i18n="ui.peak"></span></label>
        <div class="row" id="p-peak-fields">
          <label><span data-i18n="ui.multiplier"></span> <input id="p-mult" type="number" step="any" min="1"></label>
          <label><span data-i18n="ui.utcHours"></span> <input id="p-ranges" placeholder="01-04,06-10"></label>
          <label class="check"><input id="p-weekdays" type="checkbox"> <span data-i18n="ui.weekdays"></span></label>
        </div>
        <a id="p-pricing" target="_blank" data-i18n="ui.pricingPage" hidden></a>
      </fieldset>
      <div class="row between">
        <button type="button" id="p-delete" class="ghost danger" data-i18n="ui.delete"></button>
        <span class="row"><span id="p-status" class="note"></span><button type="submit" data-i18n="ui.save"></button></span>
      </div>
    </form>
  </div>
</section>

<section id="voice" hidden>
  <h1 data-i18n="ui.voiceTitle"></h1>
  <form id="voice-form" class="card form">
    <label><span data-i18n="ui.engine"></span>
      <select id="v-engine">
        <option value="gptsovits" data-i18n="ui.engineSovits"></option>
        <option value="openai" data-i18n="ui.engineOpenai"></option>
        <option value="off" data-i18n="ui.engineOff"></option>
      </select>
    </label>
    <div id="v-sovits">
      <p class="note" data-i18n="ui.sovitsNote"></p>
      <label><span data-i18n="ui.refAudio"></span>
        <span class="row"><input id="g-ref" readonly><button type="button" id="g-ref-pick" class="ghost" data-i18n="ui.pick"></button></span>
      </label>
      <label><span data-i18n="ui.refText"></span> <input id="g-ref-text"></label>
      <div class="row">
        <label><span data-i18n="ui.speed"></span> <input id="g-speed" type="number" min="0.6" max="1.6" step="0.05"></label>
        <label id="g-device-row"><span data-i18n="ui.device"></span>
          <select id="g-device">
            <option value="auto">GPU (mps)</option>
            <option value="cpu">CPU</option>
          </select>
        </label>
      </div>
      <label><span data-i18n="ui.sovitsDir"></span> <input id="g-sovits-dir"></label>
      <label><span data-i18n="ui.pythonPath"></span> <input id="g-python"></label>
    </div>
    <div id="v-openai">
      <label>Base URL <input id="v-url"></label>
      <label><span data-i18n="ui.apiKey"></span> <input id="v-key" type="password" autocomplete="off"></label>
      <div class="row">
        <label><span data-i18n="ui.voiceModel"></span> <input id="v-model"></label>
        <label><span data-i18n="ui.voiceName"></span> <input id="v-oai-voice"></label>
        <label><span data-i18n="ui.charPrice"></span> <input id="v-price" type="number" step="any" min="0"></label>
      </div>
    </div>
    <label><span data-i18n="ui.idle"></span> <input id="v-idle" type="number" min="0" max="240" step="1"></label>
    <p class="note" data-i18n="ui.idleNote"></p>
    <div class="row between">
      <button type="button" id="v-test" class="ghost" data-i18n="ui.test"></button>
      <span class="row"><span id="v-status" class="note"></span><button type="submit" data-i18n="ui.save"></button></span>
    </div>
  </form>
</section>

<section id="character" hidden>
  <h1 data-i18n="ui.generalTitle"></h1>
  <form id="general-form" class="card form">
    <label><span data-i18n="ui.language"></span>
      <select id="g-language"></select>
    </label>
    <div class="row between"><span><span data-i18n="ui.persona"></span></span><button type="button" id="g-persona-reset" class="ghost" data-i18n="ui.personaReset"></button></div>
    <textarea id="g-persona" rows="14" data-i18n-aria="ui.persona"></textarea>
    <div class="row">
      <label><span data-i18n="ui.turns"></span> <input id="g-turns" type="number" min="0" max="100"></label>
      <label><span data-i18n="ui.bubble"></span> <input id="g-bubble" type="number" min="1" max="120"></label>
      <label><span data-i18n="ui.budget"></span> <input id="g-budget" type="number" step="any" min="0"></label>
      <label><span data-i18n="ui.krw"></span> <input id="g-krw" type="number" min="1"></label>
    </div>
    <label class="check"><input id="g-search" type="checkbox"> <span data-i18n="ui.webSearch"></span></label>
    <label class="check"><input id="g-proactive" type="checkbox"> <span data-i18n="ui.proactive"></span></label>
    <p class="note" data-i18n="ui.webNote"></p>
    <fieldset>
      <legend data-i18n="ui.shortcuts"></legend>
      <p class="note" data-i18n="ui.shortcutsNote"></p>
      <div class="shortcut-list">
        <label><span data-i18n="ui.scInput"></span> <input id="s-input" class="shortcut" readonly></label>
        <label><span data-i18n="ui.scToggle"></span> <input id="s-toggle" class="shortcut" readonly></label>
        <label><span data-i18n="ui.scSd"></span> <input id="s-sd" class="shortcut" readonly></label>
        <label><span data-i18n="ui.scQuick"></span> <input id="s-quick" class="shortcut" readonly></label>
        <label><span data-i18n="ui.scVoice"></span> <input id="s-voice" class="shortcut" readonly></label>
      </div>
    </fieldset>
    <label class="check"><input id="g-block" type="checkbox"> <span data-i18n="ui.budgetBlock" data-i18n-cmd="강행"></span></label>
    <label><span data-i18n="ui.deepEffort" data-i18n-cmd="깊게"></span>
      <select id="g-effort">
        <option value="high">High</option>
        <option value="max" data-i18n="ui.effortMax"></option>
      </select>
    </label>
    <label><span data-i18n="ui.docsFolder" data-i18n-cmd="문서"></span>
      <span class="row"><input id="g-docs" readonly><button type="button" id="g-docs-pick" class="ghost" data-i18n="ui.pick"></button></span>
    </label>
    <fieldset>
      <legend data-i18n="ui.briefing"></legend>
      <label class="check"><input id="g-brief-auto" type="checkbox"> <span data-i18n="ui.briefAuto"></span></label>
      <label><span data-i18n="ui.briefTopics"></span> <input id="g-brief-topics" data-i18n-placeholder="ui.briefTopicsHint"></label>
    </fieldset>
    <fieldset>
      <legend data-i18n="ui.memory" data-i18n-cmd="기억해"></legend>
      <ul id="g-memories" class="list"></ul>
    </fieldset>
    <label><span data-i18n="ui.instructions"></span>
      <textarea id="g-instructions" rows="5" data-i18n-placeholder="ui.instructionsHint"></textarea>
    </label>
    <label><span data-i18n="ui.modelDir"></span>
      <span class="row"><input id="g-dir" readonly><button type="button" id="g-pick" class="ghost" data-i18n="ui.change"></button></span>
    </label>
    <div class="row between">
      <span></span>
      <span class="row"><span id="g-status" class="note"></span><button type="submit" data-i18n="ui.save"></button></span>
    </div>
  </form>
</section>

<section id="update" hidden>
  <h1 data-i18n="ui.updateTitle"></h1>
  <div class="card form">
    <p class="version"><span data-i18n="ui.version"></span> <strong id="u-version"></strong> <span id="u-commit" class="note"></span></p>
    <div class="row">
      <button type="button" id="u-check" class="ghost" data-i18n="ui.check"></button>
      <button type="button" id="u-apply" data-i18n="ui.apply" disabled></button>
      <span id="u-status" class="note"></span>
    </div>
    <ul id="u-list" class="list"></ul>
    <p class="note" data-i18n="ui.updateNote"></p>
  </div>
  <h1 data-i18n="ui.credits"></h1>
  <div class="card form">
    <p><strong data-i18n="ui.creditModel"></strong><br>
      <span data-i18n="ui.creditModelBy"></span><br>
      <a href="https://vgen.co/KAMIYA/product/deepseek-chan-deepseek-free-live2d-model-layered-psd-psd/1c55a71a-2747-4616-819d-2dc0a934089d" target="_blank" data-i18n="ui.creditModelPage"></a></p>
    <p><strong data-i18n="ui.creditVoice"></strong><br>
      <span data-i18n="ui.creditVoiceText"></span><br>
      ■つくよみちゃんコーパス（CV.夢前黎） <a href="https://tyc.rei-yumesaki.net/material/corpus/" target="_blank">https://tyc.rei-yumesaki.net/material/corpus/</a></p>
    <p><strong data-i18n="ui.creditEngines"></strong><br>
      <a href="https://github.com/RVC-Boss/GPT-SoVITS" target="_blank">GPT-SoVITS</a>, <a href="https://www.live2d.com/" target="_blank">Live2D Cubism Core</a>, <a href="https://github.com/guansss/pixi-live2d-display" target="_blank">pixi-live2d-display</a>, Electron</p>
    <p class="note" data-i18n="ui.creditNote"></p>
  </div>
</section>

</main>
<script src="../shared/locales/en.js"></script>
<script src="../shared/locales/ko.js"></script>
<script src="../shared/locales/ja.js"></script>
<script src="../shared/locales/zh.js"></script>
<script src="../shared/i18n.js"></script>
<script src="../shared/presets.js"></script>
<script src="dashboard.js"></script>
<script src="log.js"></script>
<script src="settings.js"></script>
</body>
</html>
